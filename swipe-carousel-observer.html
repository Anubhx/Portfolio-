<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe Carousel — GSAP Observer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js"></script>
<style>
  :root{
    --bg:#0C0C0B;
    --panel:#141413;
    --line:#2E2E29;
    --fg:#F0EDE5;
    --muted:#8A8A80;
    --accent:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .page-scroll-proof{
    height:40vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-family:monospace;
    font-size:12px;
    text-align:center;
    padding:0 24px;
  }
  .wrap{
    max-width:380px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .hint{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:12px;
  }
  .stage{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 0 16px;
    overflow:hidden;
    touch-action: pan-y; /* let vertical page-scroll pass through */
  }
  .track-wrap{
    position:relative;
    height:300px;
    overflow:hidden;
  }
  .track{
    position:absolute;
    inset:0;
    display:flex;
    will-change: transform;
  }
  .card{
    flex:0 0 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 24px;
  }
  .screen{
    width:180px;
    height:260px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px;
    font-size:13px;
    font-weight:600;
    color:#fff;
    box-shadow:0 20px 50px -15px rgba(0,0,0,0.7);
  }
  .meta{
    padding:16px 20px 4px;
    text-align:center;
    min-height:64px;
  }
  .meta .group{
    font-family:monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .meta .label{
    margin-top:4px;
    font-size:13px;
    color:var(--fg);
  }
  .counter{
    text-align:center;
    font-family:monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:14px;
    flex-wrap:wrap;
    padding:0 20px;
  }
  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#3A3A33;
    transition:none;
  }
  .arrows{
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    margin-top:14px;
  }
  .arrow-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    width:36px;
    height:36px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  .arrow-btn:active{ transform:scale(0.92); }
</style>
</head>
<body>

<div class="page-scroll-proof">
  ↓ this is normal page content above the carousel —<br>
  vertical scroll still works fine even inside the swipe zone ↓
</div>

<div class="wrap">
  <div class="hint">■ Swipe the screen — left / right</div>

  <div class="stage" id="phone-stage">
    <div class="track-wrap">
      <div class="track" id="track"></div>
    </div>

    <div class="meta">
      <div class="group" id="metaGroup">ORGANISER</div>
      <div class="label" id="metaLabel">Creates the cart</div>
    </div>
    <div class="counter" id="counter">01 / 10</div>

    <div class="dots" id="dots"></div>

    <div class="arrows">
      <button class="arrow-btn" id="prevBtn">←</button>
      <button class="arrow-btn" id="nextBtn">→</button>
    </div>
  </div>
</div>

<div class="page-scroll-proof">↓ more normal content below ↓</div>

<script>
gsap.registerPlugin(Observer);

// Placeholder step data — swap `screen` for your real /Zomato_images/*.png via <Image>
const steps = [
  { id:"01", group:"ORGANISER", label:"Creates the cart", color:"#ef4444" },
  { id:"02", group:"ORGANISER", label:"Picks payment model", color:"#dc2626" },
  { id:"03", group:"ORGANISER", label:"Shares the invite code", color:"#f97316" },
  { id:"04", group:"CONTRIBUTOR", label:"Joins with the code, no sign-up", color:"#3b82f6" },
  { id:"05", group:"CONTRIBUTOR", label:"Sees the live cart & budget", color:"#2563eb" },
  { id:"06", group:"ORGANISER", label:"Reviews the joint cart", color:"#ef4444" },
  { id:"07", group:"CONTRIBUTOR", label:"Adds common or personal items", color:"#3b82f6" },
  { id:"08", group:"SYSTEM", label:"Catches duplicates", color:"#16a34a" },
  { id:"09", group:"SYSTEM", label:"Updates the budget bar", color:"#15803d" },
  { id:"10", group:"ORGANISER", label:"Locks cart & starts checkout", color:"#ef4444" },
];

const track = document.getElementById("track");
const dotsWrap = document.getElementById("dots");
let index = 0;

// build cards
steps.forEach(s => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="screen" style="background:linear-gradient(160deg, ${s.color}, #111)">${s.id} · ${s.group}</div>`;
  track.appendChild(card);

  const dot = document.createElement("div");
  dot.className = "dot";
  dotsWrap.appendChild(dot);
});

const dots = [...dotsWrap.children];

function render(newIndex, dir = 0) {
  index = gsap.utils.clamp(0, steps.length - 1, newIndex);
  const s = steps[index];

  gsap.to(track, {
    xPercent: -100 * index,
    duration: 0.45,
    ease: "power3.out"
  });

  document.getElementById("metaGroup").textContent = s.group;
  document.getElementById("metaLabel").textContent = s.label;
  document.getElementById("counter").textContent = `${s.id} / ${steps.length}`;

  dots.forEach((d, i) => {
    gsap.to(d, {
      backgroundColor: i === index ? s.color : "#3A3A33",
      scale: i === index ? 1.3 : 1,
      duration: 0.25
    });
  });
}

function next(){ if (index < steps.length - 1) render(index + 1); }
function prev(){ if (index > 0) render(index - 1); }

document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);

// SWIPE: Observer locked to the x-axis so page scroll (y) is untouched
Observer.create({
  target: "#phone-stage",
  type: "touch,pointer",
  axis: "x",
  tolerance: 10,
  preventDefault: true,
  onLeft: () => next(),
  onRight: () => prev(),
});

render(0);

// one-time "swipe me" nudge so the affordance is discoverable without a hint label alone
gsap.fromTo(track, { xPercent: 0 }, {
  xPercent: -6,
  duration: 0.35,
  delay: 0.6,
  yoyo: true,
  repeat: 1,
  ease: "power1.inOut"
});
</script>
</body>
</html>
