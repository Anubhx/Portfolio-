<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats Strip — GSAP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root{
    --bg:#0a0a0c;
    --fg:#f2f1ee;
    --muted:#8a8a92;
    --accent1:#8b7bff;
    --accent2:#6ea8ff;
    --line: rgba(255,255,255,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .spacer{height:70vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; letter-spacing:.08em;}
  .stats{
    display:flex;
    border-top:1px solid var(--line);
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 60px;
  }
  .stat{
    flex:1;
    position:relative;
    padding:0 28px;
    overflow:hidden; /* mask for the rise-up reveal */
  }
  .stat:first-child{padding-left:0;}
  .divider{
    position:absolute;
    left:0; top:0;
    width:1px; height:0; /* grown by GSAP */
    background:var(--line);
  }
  .stat:first-child .divider{display:none;}
  .num{
    font-size:clamp(28px,4vw,40px);
    font-weight:600;
    display:flex;
    align-items:baseline;
    gap:2px;
    line-height:1;
    transform:translateY(120%);
  }
  .num .accent{ color:var(--accent1); }
  .label{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
    transform:translateY(120%);
  }
  .arrow-wrap{
    position:relative;
    width:34px; height:14px;
    overflow:hidden;
    flex-shrink:0;
  }
  .arrow-wrap svg{ position:absolute; top:0; left:0; }
  .ring{
    position:absolute;
    top:-14px; left:-18px;
    width:56px; height:56px;
    border-radius:50%;
    border:1px solid var(--accent2);
    opacity:0;
    pointer-events:none;
  }
  .wcag{ position:relative; }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding-bottom:60px;
  }
</style>
</head>
<body>

<div class="spacer">↓ scroll to trigger the strip ↓</div>

<div class="stats">
  <div class="stat">
    <div class="divider"></div>
    <div class="num"><span class="count" data-target="1">0</span><span class="accent">+</span></div>
    <div class="label">Years Industry</div>
  </div>

  <div class="stat">
    <div class="divider"></div>
    <div class="num"><span class="count" data-target="22">0</span><span class="accent">+</span></div>
    <div class="label">Screens Designed</div>
  </div>

  <div class="stat">
    <div class="divider"></div>
    <div class="num">Research</div>
    <div class="label">
      <span class="arrow-wrap">
        <svg width="60" height="14" viewBox="0 0 60 14" fill="none">
          <line x1="0" y1="7" x2="46" y2="7" stroke="#6ea8ff" stroke-width="1.5"/>
          <path d="M40 2L46 7L40 12" stroke="#6ea8ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Production
    </div>
  </div>

  <div class="stat wcag">
    <div class="divider"></div>
    <div class="ring"></div>
    <div class="num">WCAG</div>
    <div class="label">2.1 AA Mindset</div>
  </div>
</div>

<footer>GSAP + ScrollTrigger — scroll back up and down to replay</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

const tl = gsap.timeline({
  scrollTrigger:{
    trigger: ".stats",
    start: "top 85%",
    toggleActions: "play none none reverse"
  }
});

// 1. dividers draw in
tl.to(".divider", {
  height: "100%",
  duration: 0.5,
  ease: "power2.out",
  stagger: 0.08
});

// 2. numbers + labels rise from the mask, staggered
tl.to(".num", {
  y: "0%",
  duration: 0.6,
  ease: "power3.out",
  stagger: 0.08
}, "<0.1");

tl.to(".label", {
  y: "0%",
  duration: 0.6,
  ease: "power3.out",
  stagger: 0.08
}, "<0.05");

// 3. odometer count-up, tied to the same scroll trigger
document.querySelectorAll(".count").forEach(el => {
  const target = +el.dataset.target;
  const obj = { val: 0 };
  tl.to(obj, {
    val: target,
    duration: 0.9,
    ease: "power1.out",
    onUpdate: () => el.textContent = Math.floor(obj.val),
    onComplete: () => el.textContent = target
  }, "<");
});

// 4. arrow travels — small continuous loop once revealed
tl.call(() => {
  gsap.to(".arrow-wrap svg", {
    x: 10,
    duration: 0.9,
    ease: "power1.inOut",
    yoyo: true,
    repeat: -1
  });
});

// 5. WCAG accessibility ring — slow ambient pulse
tl.call(() => {
  gsap.to(".ring", {
    scale: 1.15,
    opacity: 0.5,
    duration: 1.4,
    ease: "power1.out",
    repeat: -1,
    yoyo: true,
    transformOrigin: "center"
  });
}, [], "<");
</script>
</body>
</html>
